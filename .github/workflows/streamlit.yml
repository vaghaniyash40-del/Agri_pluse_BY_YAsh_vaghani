name: AgriPulse CI/CD & Streamlit Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-streamlit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax and imports verification
      run: |
        python -m py_compile streamlit_app.py
        echo "Streamlit app compiled successfully!"

    - name: Smoke test Streamlit run
      run: |
        python -c "import streamlit; import pandas; import plotly; print('All core libraries imported successfully')"
